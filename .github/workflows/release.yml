name: Build and publish DShanPI product

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product directory name
        required: true
        default: dshanpi-a1-cm5
      version:
        description: Release version (YYYY.MM.DD-N)
        required: true
      channel:
        description: Build, promote, withdraw, or execute a reviewed purge plan
        required: true
        type: choice
        options: [testing, stable, withdraw, purge]
      backend:
        description: Repository hosting
        required: true
        type: choice
        options: [github-pages, ssh]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apt-repository-publication
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    outputs:
      image_release: ${{ steps.validate.outputs.image_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # DELIVERY_POLICY.md: artifact retention is not public image delivery.
      - name: Check delivery policy
        run: |
          python3 tools/check-delivery-policy.py
          echo 'Delivery policy: publish the signed APT cohort first, then the exact planned image assets to ArmBianOS Releases and verify both public endpoints.' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate release request
        id: validate
        env:
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
          OPERATION: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          [[ "$PRODUCT" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[1-9][0-9]*$ ]]
          test -f "products/$PRODUCT/product.json"
          if [[ "$OPERATION" == withdraw ]]; then
            echo 'image_release=false' >> "$GITHUB_OUTPUT"
            echo 'Withdrawal lifecycle: remove the exact legacy testing cohort from indexes while retaining immutable pool bytes.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$OPERATION" == purge ]]; then
            test -f "products/$PRODUCT/purges/$VERSION.json"
            echo 'image_release=false' >> "$GITHUB_OUTPUT"
            echo 'Purge lifecycle: remove the reviewed legacy testing manifests and only pool bytes that have no remaining references.' >> "$GITHUB_STEP_SUMMARY"
          else
            test -f "products/$PRODUCT/releases/$VERSION.lock.json"
            if python3 -c 'import json, sys; raise SystemExit("image_release" not in json.load(open(sys.argv[1])))' \
              "products/$PRODUCT/releases/$VERSION.lock.json"; then
              python3 scripts/image-release.py validate "$PRODUCT" "products/$PRODUCT/releases/$VERSION.lock.json"
              echo 'image_release=true' >> "$GITHUB_OUTPUT"
            elif python3 -c 'import json, sys; raise SystemExit("maintenance_adapter" not in json.load(open(sys.argv[1])))' \
              "products/$PRODUCT/releases/$VERSION.lock.json"; then
              echo 'image_release=false' >> "$GITHUB_OUTPUT"
              echo 'Package-maintenance lifecycle: publish APT and release markers without rebuilding images.' >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$OPERATION" == testing ]]; then
              echo 'New complete image builds require a fixed image_release plan' >&2
              exit 1
            else
              echo 'image_release=false' >> "$GITHUB_OUTPUT"
              echo 'Legacy APT-only lifecycle: no image Release plan is present.' >> "$GITHUB_STEP_SUMMARY"
            fi
            TESTING_PURGE_PLAN=$(jq -r '.testing_purge_plan // empty' \
              "products/$PRODUCT/releases/$VERSION.lock.json")
            if [[ -n "$TESTING_PURGE_PLAN" ]]; then
              [[ "$TESTING_PURGE_PLAN" == "$VERSION" ]] || {
                echo 'testing_purge_plan must match the replacement release version' >&2
                exit 1
              }
              test -f "products/$PRODUCT/purges/$TESTING_PURGE_PLAN.json"
              jq -e --arg product "$PRODUCT" --arg version "$VERSION" \
                '.product == $product and .replacement_version == $version' \
                "products/$PRODUCT/purges/$TESTING_PURGE_PLAN.json" >/dev/null
              if [[ "$OPERATION" == testing ]]; then
                echo 'Testing publication will atomically replace the reviewed legacy cohorts.' >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            if [[ "$OPERATION" == stable ]]; then
              test -f "products/$PRODUCT/releases/$VERSION.hardware-acceptance.json" || {
                echo 'Stable requires the committed release hardware-acceptance JSON' >&2
                exit 1
              }
            fi
          fi

      - name: Install release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gh jq patchelf rsync sshpass xz-utils

      - name: Configure APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_KEY_FINGERPRINT: ${{ secrets.APT_GPG_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          test "$(gpg --batch --with-colons --list-secret-keys "$APT_GPG_KEY_FINGERPRINT" | awk -F: '$1 == "fpr" {print $10; exit}')" = "$APT_GPG_KEY_FINGERPRINT"
          mkdir -p output
          gpg --batch --armor --export "$APT_GPG_KEY_FINGERPRINT" > output/dshanpi-archive.asc

      - name: Configure GitHub repository authentication
        if: ${{ inputs.backend == 'github-pages' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

      - name: Fetch signed GitHub Pages state
        if: ${{ inputs.backend == 'github-pages' }}
        run: scripts/fetch-pages.sh output/repository output/dshanpi-archive.asc

      - name: Fetch current immutable APT state
        if: ${{ inputs.backend == 'ssh' }}
        env:
          SSHPASS: ${{ secrets.DL_PASSWORD }}
          DL_HOST: ${{ secrets.DL_HOST }}
          DL_PORT: ${{ secrets.DL_PORT }}
          DL_USERNAME: ${{ secrets.DL_USERNAME }}
          DL_KNOWN_HOSTS: ${{ secrets.DL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DL_KNOWN_HOSTS" > output/known_hosts
          mkdir -p output/repository
          sshpass -e rsync -azL -e "ssh -p $DL_PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$PWD/output/known_hosts" \
            "$DL_USERNAME@$DL_HOST:/home1/dlfile/apt/" output/repository/

      - name: Build product release
        if: ${{ inputs.channel == 'testing' }}
        env:
          APT_PUBLIC_KEY_FILE: ${{ github.workspace }}/output/dshanpi-archive.asc
          DSHANPI_PUBLISHED_REPOSITORY: ${{ github.workspace }}/output/repository
        run: |
          if jq -e 'has("maintenance_adapter")' \
            "products/${{ inputs.product }}/releases/${{ inputs.version }}.lock.json" >/dev/null; then
            python3 scripts/build-maintenance-release.py \
              "${{ inputs.product }}" "${{ inputs.version }}" output/repository
          else
            scripts/build-product.sh "${{ inputs.product }}" \
              "products/${{ inputs.product }}/releases/${{ inputs.version }}.lock.json"
          fi

      - name: Build signed testing repository
        if: ${{ inputs.channel == 'testing' }}
        env:
          APT_GPG_KEY_FINGERPRINT: ${{ secrets.APT_GPG_KEY_FINGERPRINT }}
        run: |
          scripts/build-apt-repository.sh testing "${{ inputs.product }}" "${{ inputs.version }}" \
            "output/${{ inputs.product }}/${{ inputs.version }}/packages" output/repository \
            "$APT_GPG_KEY_FINGERPRINT"

      - name: Apply reviewed replacement purge to testing candidate
        if: ${{ inputs.channel == 'testing' }}
        env:
          APT_GPG_KEY_FINGERPRINT: ${{ secrets.APT_GPG_KEY_FINGERPRINT }}
        run: |
          plan=$(jq -r '.testing_purge_plan // empty' \
            "products/${{ inputs.product }}/releases/${{ inputs.version }}.lock.json")
          if [[ -n "$plan" ]]; then
            expected_base=$(jq -r .expected_base_state_sha256 output/repository/PUBLICATION.json)
            DSHANPI_EXPECTED_BASE_STATE_SHA256="$expected_base" \
              scripts/purge-testing-releases.sh "${{ inputs.product }}" "$plan" \
              output/repository "$APT_GPG_KEY_FINGERPRINT"
          fi

      - name: Prepare fixed image Release assets
        if: ${{ inputs.channel == 'testing' && steps.validate.outputs.image_release == 'true' }}
        run: |
          python3 scripts/image-release.py prepare \
            "${{ inputs.product }}" \
            "products/${{ inputs.product }}/releases/${{ inputs.version }}.lock.json" \
            "output/${{ inputs.product }}/${{ inputs.version }}/images" \
            "output/${{ inputs.product }}/${{ inputs.version }}/packages" \
            "output/${{ inputs.product }}/${{ inputs.version }}/image-release"

      - name: Promote exact testing cohort
        if: ${{ inputs.channel == 'stable' }}
        env:
          APT_GPG_KEY_FINGERPRINT: ${{ secrets.APT_GPG_KEY_FINGERPRINT }}
        run: |
          python3 scripts/validate-hardware-evidence.py \
            "${{ inputs.product }}" "${{ inputs.version }}" \
            "products/${{ inputs.product }}/releases/${{ inputs.version }}.hardware-acceptance.json" \
            output/repository
          scripts/promote-apt-release.sh "${{ inputs.product }}" "${{ inputs.version }}" \
            output/repository "$APT_GPG_KEY_FINGERPRINT"

      - name: Withdraw testing cohort
        if: ${{ inputs.channel == 'withdraw' }}
        env:
          APT_GPG_KEY_FINGERPRINT: ${{ secrets.APT_GPG_KEY_FINGERPRINT }}
        run: |
          scripts/withdraw-testing-release.sh "${{ inputs.product }}" "${{ inputs.version }}" \
            output/repository "$APT_GPG_KEY_FINGERPRINT"

      - name: Purge reviewed legacy testing cohorts
        if: ${{ inputs.channel == 'purge' }}
        env:
          APT_GPG_KEY_FINGERPRINT: ${{ secrets.APT_GPG_KEY_FINGERPRINT }}
        run: |
          scripts/purge-testing-releases.sh "${{ inputs.product }}" "${{ inputs.version }}" \
            output/repository "$APT_GPG_KEY_FINGERPRINT"

      - name: Retain prepared image Release assets and provenance
        if: ${{ inputs.channel == 'testing' && steps.validate.outputs.image_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.product }}-${{ inputs.version }}
          path: |
            output/${{ inputs.product }}/${{ inputs.version }}/image-release/
            output/${{ inputs.product }}/${{ inputs.version }}/release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Retain package-maintenance evidence
        if: ${{ inputs.channel == 'testing' && steps.validate.outputs.image_release == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.product }}-${{ inputs.version }}-packages
          path: |
            output/${{ inputs.product }}/${{ inputs.version }}/packages/SHA256SUMS
            output/${{ inputs.product }}/${{ inputs.version }}/packages/*-build.json
            products/${{ inputs.product }}/releases/${{ inputs.version }}.lock.json
          if-no-files-found: error
          retention-days: 30

      - name: Pack signed testing repository candidate
        if: ${{ inputs.channel == 'testing' }}
        run: |
          tar --sort=name --format=posix --numeric-owner --owner=0 --group=0 \
            -cf output/repository-candidate.tar -C output/repository .
          sha256sum output/repository-candidate.tar > output/repository-candidate.tar.sha256

      - name: Retain signed testing repository candidate
        if: ${{ inputs.channel == 'testing' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.product }}-${{ inputs.version }}-repository
          path: |
            output/repository-candidate.tar
            output/repository-candidate.tar.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish verified repository candidate
        if: ${{ inputs.backend == 'ssh' }}
        env:
          DL_HOST: ${{ secrets.DL_HOST }}
          DL_PORT: ${{ secrets.DL_PORT }}
          DL_USERNAME: ${{ secrets.DL_USERNAME }}
          DL_PASSWORD: ${{ secrets.DL_PASSWORD }}
          DL_KNOWN_HOSTS: ${{ github.workspace }}/output/known_hosts
        run: scripts/publish-apt.sh output/repository

      - name: Publish signed GitHub Pages snapshot
        if: ${{ inputs.backend == 'github-pages' }}
        run: scripts/publish-pages.sh output/repository output/dshanpi-archive.asc

      # GITHUB_TOKEN pushes do not start another workflow; deploy in this run.
      - name: Prepare Pages artifact
        if: ${{ inputs.backend == 'github-pages' }}
        run: |
          cp output/dshanpi-archive.asc output/repository/archive-key.asc
          gpg --batch --yes --dearmor --output output/repository/dshanpi-archive-keyring.gpg output/dshanpi-archive.asc
          python3 scripts/pages/catalog.py output/repository
          cp scripts/pages/index.html output/repository/
          touch output/repository/.nojekyll
      - uses: actions/configure-pages@v5
        if: ${{ inputs.backend == 'github-pages' }}
      - uses: actions/upload-pages-artifact@v4
        if: ${{ inputs.backend == 'github-pages' }}
        with:
          path: output/repository
  deploy:
    if: ${{ inputs.backend == 'github-pages' }}
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  publish-image-release:
    if: ${{ always() && needs.release.outputs.image_release == 'true' && (inputs.channel == 'testing' || inputs.channel == 'stable') && needs.release.result == 'success' && (inputs.backend == 'ssh' || needs.deploy.result == 'success') }}
    needs: [release, deploy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        if: ${{ inputs.channel == 'testing' }}
        with:
          name: ${{ inputs.product }}-${{ inputs.version }}
          path: output/${{ inputs.product }}/${{ inputs.version }}
      - name: Install public verification tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev gh gnupg jq xz-utils
      - name: Verify the exact signed APT cohort is public
        run: python3 scripts/verify-product-public.py "${{ inputs.product }}" "${{ inputs.version }}"
      - name: Publish and verify planned testing image Release
        if: ${{ inputs.channel == 'testing' }}
        env:
          GH_TOKEN: ${{ secrets.ARMBIANOS_RELEASE_TOKEN }}
        run: |
          scripts/publish-image-release.sh \
            "${{ inputs.product }}" \
            "products/${{ inputs.product }}/releases/${{ inputs.version }}.lock.json" \
            "output/${{ inputs.product }}/${{ inputs.version }}/image-release" \
            testing
      - name: Promote the verified image Release without rebuilding assets
        if: ${{ inputs.channel == 'stable' }}
        env:
          GH_TOKEN: ${{ secrets.ARMBIANOS_RELEASE_TOKEN }}
          HARDWARE_EVIDENCE: products/${{ inputs.product }}/releases/${{ inputs.version }}.hardware-acceptance.json
        run: |
          scripts/publish-image-release.sh \
            "${{ inputs.product }}" \
            "products/${{ inputs.product }}/releases/${{ inputs.version }}.lock.json" \
            . stable "$HARDWARE_EVIDENCE"
