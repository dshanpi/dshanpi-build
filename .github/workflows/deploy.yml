name: Deploy signed APT repository
on:
  push:
    branches: [feature/apt-pages-state]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: apt-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify signed repository
        run: |
          python3 tools/snapshot.py decode snapshot public
          python3 tools/verify-repository.py --snapshot public archive-key.asc public
          cp archive-key.asc public/
          gpg --batch --yes --dearmor --output public/dshanpi-archive-keyring.gpg archive-key.asc
          cp site/* public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
