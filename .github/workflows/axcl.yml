name: Build and publish A1 AXCL packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Committed A1 AXCL maintenance release (YYYY.MM.DD-N)
        required: true
        default: '2026.10.09-2'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    uses: ./.github/workflows/release.yml
    with:
      product: dshanpi-a1
      version: ${{ inputs.version }}
      channel: testing
      backend: ssh
    secrets: inherit
