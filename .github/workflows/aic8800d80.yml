name: Build and publish A1 AIC8800D80 packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Committed A1 AIC8800D80 maintenance release (YYYY.MM.DD-N)
        required: true
        default: '2026.10.09-3'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    uses: ./.github/workflows/release.yml
    with:
      product: dshanpi-a1
      version: ${{ inputs.version }}
      channel: testing
      backend: ssh
    secrets: inherit
